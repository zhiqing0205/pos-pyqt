name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: pos-pyqt-windows-x64
            exe_name: 超市收银系统.exe
          - os: macos-14            # Apple Silicon (M1/M2)
            artifact: pos-pyqt-macos-arm64
            exe_name: 超市收银系统
          - os: ubuntu-22.04
            artifact: pos-pyqt-linux-x64
            exe_name: 超市收银系统

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Linux: install system dependencies for Qt
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-glx libegl1 libxkbcommon0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libxcb-shape0 \
            libxcb-cursor0 libglib2.0-0 libfontconfig1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --clean \
            --name "${{ matrix.exe_name }}" \
            --windowed \
            --add-data "app:app" \
            --hidden-import qfluentwidgets \
            --hidden-import qfluentwidgets.components \
            --hidden-import qfluentwidgets._rc \
            --collect-all qfluentwidgets \
            main.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/${{ matrix.exe_name }}/*" -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Package (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          cd dist
          tar czf "../${{ matrix.artifact }}.tar.gz" "${{ matrix.exe_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: List files
        run: ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            pos-pyqt-windows-x64.zip
            pos-pyqt-macos-arm64.tar.gz
            pos-pyqt-linux-x64.tar.gz
