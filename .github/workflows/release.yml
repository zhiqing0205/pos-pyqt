name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: pos-pyqt-windows-x64
          - os: macos-14
            artifact: pos-pyqt-macos-arm64
          - os: ubuntu-22.04
            artifact: pos-pyqt-linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-glx libegl1 libxkbcommon0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libxcb-shape0 \
            libxcb-cursor0 libglib2.0-0 libfontconfig1

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Build ──

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pyinstaller --noconfirm --clean \
            --name "pos-pyqt" \
            --windowed \
            --icon NONE \
            --add-data "app;app" \
            --hidden-import qfluentwidgets \
            --hidden-import qfluentwidgets.components \
            --hidden-import qfluentwidgets._rc \
            --collect-all qfluentwidgets \
            main.py

      - name: Build with PyInstaller (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --clean \
            --name "pos-pyqt" \
            --windowed \
            --add-data "app:app" \
            --hidden-import qfluentwidgets \
            --hidden-import qfluentwidgets.components \
            --hidden-import qfluentwidgets._rc \
            --collect-all qfluentwidgets \
            main.py

      - name: Build with PyInstaller (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconfirm --clean \
            --name "pos-pyqt" \
            --windowed \
            --add-data "app:app" \
            --hidden-import qfluentwidgets \
            --hidden-import qfluentwidgets.components \
            --hidden-import qfluentwidgets._rc \
            --collect-all qfluentwidgets \
            main.py

      # ── Package ──

      # Windows: portable zip
      - name: Package portable zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/pos-pyqt/*" -DestinationPath "${{ matrix.artifact }}-portable.zip"

      # Windows: installer via Inno Setup
      - name: Create installer (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cat > installer.iss << 'INNO_EOF'
          [Setup]
          AppName=pos-pyqt
          AppVersion=${{ github.ref_name }}
          DefaultDirName={autopf}\pos-pyqt
          DefaultGroupName=pos-pyqt
          OutputDir=.
          OutputBaseFilename=${{ matrix.artifact }}-setup
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          UninstallDisplayIcon={app}\pos-pyqt.exe

          [Files]
          Source: "dist\pos-pyqt\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs

          [Icons]
          Name: "{group}\pos-pyqt"; Filename: "{app}\pos-pyqt.exe"
          Name: "{autodesktop}\pos-pyqt"; Filename: "{app}\pos-pyqt.exe"; Tasks: desktopicon

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional icons:"
          INNO_EOF
          iscc installer.iss

      # macOS: zip (from .app bundle)
      - name: Package zip (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r -y "../${{ matrix.artifact }}.zip" pos-pyqt.app

      # macOS: dmg
      - name: Package dmg (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmg_content
          cp -R dist/pos-pyqt.app dmg_content/
          ln -s /Applications dmg_content/Applications
          hdiutil create -volname "pos-pyqt" -srcfolder dmg_content -ov -format UDZO "${{ matrix.artifact }}.dmg"

      # Linux: tar.gz
      - name: Package tar.gz (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          tar czf "../${{ matrix.artifact }}.tar.gz" pos-pyqt

      # ── Upload ──

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}*.zip
            ${{ matrix.artifact }}*.tar.gz
            ${{ matrix.artifact }}*.dmg
            ${{ matrix.artifact }}*.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: List files
        run: ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            pos-pyqt-windows-x64-portable.zip
            pos-pyqt-windows-x64-setup.exe
            pos-pyqt-macos-arm64.zip
            pos-pyqt-macos-arm64.dmg
            pos-pyqt-linux-x64.tar.gz
